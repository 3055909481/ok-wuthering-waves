# Manually triggered, portable-archive-only release for Monster.
#
# Compared with build.yml this workflow deliberately drops:
#   * repository synchronisation (CNB / upstream update repos),
#   * exe signing (SignPath),
#   * NSIS installers and the online installer,
#   * MirrorChyan / release-note distribution.
# The only published artifact is a self-contained portable archive.
#
# Updating WITHOUT re-downloading the ~2 GiB archive:
#   pyappify-action always emits a launcher-only "<App>-win32.zip" next to the
#   portable archive. That zip contains PyAppify's real Tauri launcher. In
#   "updater" mode this workflow extracts it and puts it back into the archive
#   as Monster/Monster.exe. The launcher reads data/apps/Monster/app.json,
#   fetches only NEW release tags from pyappify.yml's git_url (our own fork),
#   and checks them out into data/apps/Monster/working. Python, pip packages,
#   bundled templates and configs/ are NOT tracked by that repository, so they
#   survive every update. Only changed source files are transferred.
#   In "cmd-only" mode a tiny icon-only exe wrapper is shipped instead, with no
#   network/update logic at all, for users who prefer a fully offline package.
#
#   BOTH entry points must run elevated. PyAppify v1.2.7 builds the Tauri
#   launcher with UAC disabled (src-tauri/build.rs: "const UAC: bool = false"),
#   so an unpatched Monster.exe runs pythonw at MEDIUM integrity while Wuthering
#   Waves runs at HIGH. UIPI then blocks PostMessage with Win32 error 5
#   ("Access is denied") and the script cannot click or press keys. Monster.cmd
#   already self-elevates via fltmc + RunAs; the "Require administrator for the
#   updater launcher" step patches the extracted exe's RT_MANIFEST the same way.

name: Monster Portable Release
run-name: Monster portable · ${{ inputs.version || format('auto run {0}', github.run_number) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v3.8.1 or v3.8.1-beta.1. Leave empty to auto-generate. PyAppify only accepts the newest release tag, so a version older than the newest existing one is automatically raised to the next major version.'
        required: false
        default: ''
        type: string
      package_format:
        description: 'Archive format. 7z is the default: solid LZMA2 keeps the package small enough for a GitHub Release asset. The zip build is ~2.25 GiB and exceeds GitHub''s 2 GiB per-asset limit, so it is delivered as an Actions artifact only. Open 7z with 7-Zip or Windows 11 23H2+.'
        required: true
        default: '7z'
        type: choice
        options:
          - 7z
          - zip
      launcher:
        description: 'updater = ship PyAppify''s real launcher (incremental updates, configs/ preserved, needs network for updates). cmd-only = ship the offline icon-only wrapper around Monster.cmd, no update logic.'
        required: true
        default: 'updater'
        type: choice
        options:
          - updater
          - cmd-only
      update_repo:
        description: 'UPDATE SOURCE: git URL the launcher pulls new versions from. Leave empty to use this fork (your own published release tags). For another repository, enter a version tag manually in "version" and publish the SAME tag there first, with runnable source files and a pyappify.yml whose git_url points back to that repo.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Also create a GitHub Release with the archive. When off, only the Actions artifact is uploaded.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: monster-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable archive
    runs-on: windows-latest
    env:
      # Injected into every git / libgit2 process in this job, including the
      # repository PyAppify clones, so paths beyond MAX_PATH are accepted.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: 'core.longpaths'
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Enable Windows long paths for the packaging checkout
        run: |
          # PyAppify checks out the application repository with libgit2. Several
          # ok_templates/*.jpg names are ~170 characters; combined with the deep
          # runner path (D:\a\<repo>\<repo>\pyappify_dist\Monster\data\apps\
          # Monster\working\...) they exceed MAX_PATH (260) and libgit2 aborts
          # the checkout with "path too long: ...; class=Filesystem (30)".
          # libgit2 honours core.longpaths; the registry flag helps Win32 APIs
          # that do not use the \\?\ prefix.
          git config --global core.longpaths true
          try {
            New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
              -Name 'LongPathsEnabled' -Value 1 -PropertyType DWord -Force -ErrorAction Stop | Out-Null
            Write-Host 'Windows LongPathsEnabled registry flag set.'
          } catch {
            Write-Host "Could not set LongPathsEnabled (non-fatal): $($_.Exception.Message)"
          }
          $value = (& git config --get core.longpaths | Out-String).Trim()
          $reg = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "core.longpaths = $value ; HKLM LongPathsEnabled = $reg"
          if ($value -ne 'true') { throw 'Failed to enable core.longpaths.' }

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Resolve version tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $tag = "$env:INPUT_VERSION".Trim()
          $adjusted = $false

          # PyAppify rejects a --setup-version that is not among the newest
          # release tags ("Setup version ... is no longer available"). This
          # fork inherited 1000+ upstream tags (newest v3.8.0), so a low
          # version such as v1.0.0 fails. Keep the build tag strictly newer
          # than every existing release tag, exactly like upstream releases do.
          $maxMajor = 0; $maxMinor = 0; $maxPatch = 0
          $rawTags = (& git tag -l "v*" | Out-String).Trim()
          foreach ($existingTag in ($rawTags -split "`n")) {
            if ($existingTag.Trim() -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              # PowerShell variable names are case-insensitive: $M and $m would
              # be the SAME variable, so use distinct names for major/minor/patch.
              $curMajor = [int]$Matches[1]; $curMinor = [int]$Matches[2]; $curPatch = [int]$Matches[3]
              if (($curMajor -gt $maxMajor) -or
                  ($curMajor -eq $maxMajor -and $curMinor -gt $maxMinor) -or
                  ($curMajor -eq $maxMajor -and $curMinor -eq $maxMinor -and $curPatch -gt $maxPatch)) {
                $maxMajor = $curMajor; $maxMinor = $curMinor; $maxPatch = $curPatch
              }
            }
          }
          Write-Host "Newest existing release tag: v$maxMajor.$maxMinor.$maxPatch"

          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v$($maxMajor + 1).0.$env:RUN_NUMBER"
            $adjusted = $true
            Write-Host "Auto-selected version tag: $tag"
          } elseif ($tag -match '^v?(\d+)\.(\d+)\.(\d+)((?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?)$') {
            $inMajor = [int]$Matches[1]; $inMinor = [int]$Matches[2]; $inPatch = [int]$Matches[3]
            $suffix = $Matches[4]
            $newer = ($inMajor -gt $maxMajor) -or
                     ($inMajor -eq $maxMajor -and $inMinor -gt $maxMinor) -or
                     ($inMajor -eq $maxMajor -and $inMinor -eq $maxMinor -and $inPatch -gt $maxPatch)
            if (-not $newer) {
              $raised = "v$($maxMajor + 1).$inMinor.$inPatch$suffix"
              Write-Host "Requested $tag is older than v$maxMajor.$maxMinor.$maxPatch; raised to $raised because PyAppify packages only the newest release tag."
              $tag = $raised
              $adjusted = $true
            }
          }

          # Auto-generated / raised tags must not collide with an existing one.
          if ($adjusted) {
            $used = @((& git tag -l | Out-String).Trim() -split "`n" | ForEach-Object { $_.Trim() })
            while ($used -contains $tag) {
              if ($tag -match '^v(\d+)\.(\d+)\.(\d+)(.*)$') {
                $collMajor = [int]$Matches[1]; $collMinor = [int]$Matches[2]; $collPatch = [int]$Matches[3] + 1
                $suf = $Matches[4]
                $tag = "v$collMajor.$collMinor.$collPatch$suf"
              } else { break }
            }
            Write-Host "Final auto-adjusted tag: $tag"
          }

          # Must match PyAppify's version-tag pattern: v?X.Y.Z[-(alpha|beta|rc)[.N]]
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?$') {
            throw "Version '$tag' is not a valid PyAppify version tag (use v1.2.3 or v1.2.3-beta.1)."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging version tag: $tag"

      - name: Create version tag on the current commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          # git tag -l yields no output (PowerShell $null) when the tag is absent;
          # Out-String guarantees a string so .Trim() is always safe.
          $existing = (& git tag -l "$env:TAG" | Out-String).Trim()
          if ($existing -eq $env:TAG) {
            $tagged = (& git rev-parse "$env:TAG^{commit}" | Out-String).Trim()
            $head = (& git rev-parse HEAD | Out-String).Trim()
            if ($tagged -ne $head) {
              throw "Tag $env:TAG already exists on commit $tagged (HEAD is $head). Use another version or leave version empty for an auto-selected one."
            }
            Write-Host "Reusing existing tag $env:TAG on HEAD."
          } else {
            & git tag -a "$env:TAG" -m "Monster portable release $env:TAG"
            if ($LASTEXITCODE -ne 0) { throw "git tag failed." }
            & git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw "git push tag failed." }
            Write-Host "Created and pushed tag $env:TAG."
          }

      - name: Validate custom update repository
        if: ${{ inputs.update_repo != '' }}
        env:
          CUSTOM_UPDATE_REPO: ${{ inputs.update_repo }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # PyAppify clones git_url during setup and checks out --setup-version.
          # A custom update source therefore has to carry the build tag before
          # packaging starts; otherwise the build fails 20 minutes later with
          # "Setup version ... is no longer available".
          $url = "$env:CUSTOM_UPDATE_REPO".Trim()
          if ($url -notmatch '^https://') { throw "update_repo must be an https git URL, got '$url'." }
          $found = (& git ls-remote --tags $url "refs/tags/$env:TAG" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot read tags from custom update repo $url." }
          if (-not $found) {
            throw "Custom update repo $url has no tag $env:TAG. Publish this tag (with main.py, config.py, src/, pyappify.yml, ...) there first, or leave update_repo empty to use this fork."
          }
          Write-Host "Custom update repo $url already carries tag $env:TAG."

      - name: Write portable-only PyAppify config
        env:
          APP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CUSTOM_UPDATE_REPO: ${{ inputs.update_repo }}
        run: |
          # git_url is the UPDATE SOURCE. By default it is this fork: every tag
          # created above is one of OUR OWN published releases, so the launcher
          # never talks to ok-oldking's update repositories. keep_releases: 1
          # makes both the bundled clone and later fetches shallow, so an update
          # transfers only the new tag's changed objects, not the Python env.
          $repoUrl = $env:APP_REPO_URL
          if (-not [string]::IsNullOrWhiteSpace($env:CUSTOM_UPDATE_REPO)) {
            $repoUrl = "$env:CUSTOM_UPDATE_REPO".Trim()
          }
          Write-Host "Launcher update source (git_url): $repoUrl"

          # Keep the profile values identical to the committed pyappify.yml.
          # At the end of setup PyAppify reloads the CHECKED-OUT repository's
          # pyappify.yml (the one from git_url) and uses its profiles to sync
          # tags. Both copies must point at the same update source, or the build
          # tag gets pruned and setup dies with "Setup version ... is no longer
          # available". That is why upstream's update repos were replaced here.
          $lines = @(
            'name: "Monster"'
            'icon: "icons/icon.png"'
            # Only the build tag's history is bundled. Without this the archive
            # carried 1000+ inherited tags (~2.6 GB) and exceeded GitHub's
            # 2 GiB Release asset limit.
            'keep_releases: 1'
            'profiles:'
            '  - name: "Portable"'
            ('    git_url: "' + $repoUrl + '"')
            '    admin: true'
            '    main_script: "main.py"'
            '    requires_python: "3.12"'
            '    requirements: "requirements.txt"'
            '    use_pythonw: true'
            '    pip_args: "--no-deps"'
          )
          $target = Join-Path (Get-Location) 'pyappify.yml'
          [System.IO.File]::WriteAllLines($target, $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $target

      # cmd-only mode: package_zip ships Monster.cmd instead of PyAppify's
      # Tauri launcher. A .cmd has no icon and cannot be pinned nicely, so
      # compile a tiny Win32 GUI wrapper that only invokes Monster.cmd. It has
      # no update/network logic. Compile before packaging: it only needs tracked
      # assets, so a compiler problem fails fast instead of after a 20 min build.
      # updater mode skips this and uses the real launcher extracted later.
      - name: Build offline icon-only Monster.exe wrapper
        if: ${{ inputs.launcher == 'cmd-only' }}
        run: |
          $compiler = @(
            (Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe')
            (Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'The .NET Framework C# compiler is not available on this runner.' }
          $source = Join-Path (Get-Location) '.github/scripts/MonsterLauncher.cs'
          $manifest = Join-Path (Get-Location) '.github/scripts/MonsterLauncher.manifest.xml'
          $icon = Join-Path (Get-Location) 'icons/launcher.ico'
          foreach ($asset in @($source, $manifest, $icon)) {
            if (-not (Test-Path $asset)) { throw "Launcher asset missing: $asset" }
          }
          $outDir = Join-Path (Get-Location) 'launcher'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $out = Join-Path $outDir 'Monster.exe'
          & $compiler /nologo /target:winexe /optimize+ "/out:$out" "/win32icon:$icon" "/win32manifest:$manifest" $source
          if ($LASTEXITCODE -ne 0) { throw "Compiling Monster.exe failed (exit $LASTEXITCODE)." }
          if (-not (Test-Path $out)) { throw 'Compiler reported success but Monster.exe is missing.' }
          Write-Host ("Built {0} ({1} bytes)" -f $out, (Get-Item -LiteralPath $out).Length)

      - name: Build portable archive (no installers, no online setup)
        id: package
        uses: ok-oldking/pyappify-action@69bf7ae364e8c7f0606f34df86d432168a46f4bf
        with:
          version: v1.2.7
          build_setup: false
          package_zip: true
          package_zip_format: ${{ inputs.package_format }}
          add_version_name: true
          app_version: ${{ steps.version.outputs.tag }}

      # PyAppify streams pip output into its own emitter instead of the job log,
      # so a failed "setup" only reports "exit code 1". Surface the real error.
      - name: Diagnose PyAppify setup failure
        if: failure()
        run: |
          Write-Host '=== PyAppify / launcher logs ==='
          Get-ChildItem -Path pyappify_dist -Recurse -File -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content -LiteralPath $_.FullName -Tail 60 -ErrorAction SilentlyContinue
            }
          $py = Join-Path (Get-Location) 'pyappify_dist/Monster/data/apps/Monster/python/python.exe'
          $req = Join-Path (Get-Location) 'pyappify_dist/Monster/data/apps/Monster/working/requirements.txt'
          Write-Host "bundled python exists: $(Test-Path $py)"
          Write-Host "bundled requirements exists: $(Test-Path $req)"
          if ((Test-Path $py) -and (Test-Path $req)) {
            Write-Host '=== Rerun the exact setup pip command with visible output ==='
            & $py -m pip install --no-warn-script-location --no-deps -r $req 2>&1 |
              ForEach-Object { Write-Host $_ }
            Write-Host "pip exit code: $LASTEXITCODE"
          }

      # updater mode: pyappify-action always emits a launcher-only zip alongside
      # the package. Extract the REAL Tauri launcher and stage it at the same
      # path the wrapper uses, so the embed step below is mode-agnostic. This
      # exe is the "startup + update program" from the original project: it
      # reads data/apps/Monster/app.json, fetches new tags from git_url and
      # checks them out into working/, keeping configs/ and the Python env.
      - name: Extract PyAppify updater launcher
        if: ${{ inputs.launcher == 'updater' }}
        run: |
          $zip = Join-Path (Get-Location) 'pyappify_dist/Monster-win32.zip'
          if (-not (Test-Path $zip)) {
            Write-Host 'pyappify_dist contents:'
            Get-ChildItem -Path pyappify_dist -File | ForEach-Object { Write-Host $_.Name }
            throw "Launcher-only zip $zip was not produced by pyappify-action."
          }
          $extract = Join-Path (Get-Location) 'launcher_extract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $exe = Join-Path $extract 'Monster/Monster.exe'
          if (-not (Test-Path $exe)) { throw "Monster/Monster.exe not found inside $zip." }
          $size = (Get-Item -LiteralPath $exe).Length
          # The offline icon-only wrapper is ~100 KB; the Tauri launcher is MBs.
          if ($size -lt 1MB) { throw "Extracted launcher is only $size bytes; expected PyAppify's Tauri binary." }
          $outDir = Join-Path (Get-Location) 'launcher'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $outDir 'Monster.exe') -Force
          Write-Host ("Using PyAppify updater launcher ({0} bytes)" -f $size)

      # PyAppify's embedded manifest has no trustInfo, i.e. asInvoker. Launching
      # Monster.exe directly then leaves pythonw at MEDIUM integrity and every
      # PostMessage to the elevated game window fails with Win32 error 5 (UIPI).
      # Patch RT_MANIFEST/1 so double-clicking the launcher requests elevation
      # once, and the whole process tree (launcher -> pythonw) is HIGH.
      - name: Require administrator for the updater launcher
        if: ${{ inputs.launcher == 'updater' }}
        run: |
          $script = Join-Path (Get-Location) '.github/scripts/patch_launcher_manifest.py'
          $manifest = Join-Path (Get-Location) '.github/scripts/MonsterUpdater.manifest.xml'
          foreach ($asset in @($script, $manifest)) {
            if (-not (Test-Path $asset)) { throw "Launcher asset missing: $asset" }
          }
          $exe = Join-Path (Get-Location) 'launcher/Monster.exe'
          if (-not (Test-Path $exe)) { throw 'Extracted updater launcher is missing.' }
          # ctypes calls the Win32 resource-update APIs directly; no compiler
          # is needed. The runner has python on PATH, and the Python that
          # pyappify-action just bundled is a guaranteed fallback.
          $py = (Get-Command python -ErrorAction SilentlyContinue).Source
          if (-not $py) {
            $py = Join-Path (Get-Location) 'pyappify_dist/Monster/data/apps/Monster/python/python.exe'
          }
          if (-not $py -or -not (Test-Path $py)) { throw 'No Python interpreter is available to patch the launcher manifest.' }
          & $py $script $exe $manifest
          if ($LASTEXITCODE -ne 0) { throw "Patching the launcher manifest failed (exit $LASTEXITCODE)." }
          Write-Host ("Patched launcher requires administrator ({0} bytes)" -f (Get-Item -LiteralPath $exe).Length)

      # Whichever mode was selected, launcher/Monster.exe now holds the binary
      # to place next to Monster.cmd inside Monster/.
      - name: Embed Monster.exe in the portable archive
        env:
          PACKAGE_FORMAT: ${{ inputs.package_format }}
        run: |
          $seven = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $seven) {
            $fallback = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            if (Test-Path $fallback) { $seven = $fallback }
          }
          if (-not $seven) { throw '7-Zip is not available on this runner.' }
          $archive = @(Get-ChildItem -Path pyappify_dist -Filter "Monster-win32-Portable-*.$env:PACKAGE_FORMAT" -File)
          if ($archive.Count -ne 1) { throw "Expected one portable archive, found $($archive.Count)." }
          $exe = Join-Path (Get-Location) 'launcher/Monster.exe'
          if (-not (Test-Path $exe)) { throw 'Compiled Monster.exe is missing.' }

          # 7z stores whatever relative path it is given, so stage the exe at
          # Monster/Monster.exe to match Monster/Monster.cmd inside the archive.
          $stage = Join-Path (Get-Location) 'launcher_stage/Monster'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'Monster.exe') -Force
          $root = Join-Path (Get-Location) 'launcher_stage'
          $target = $archive[0].FullName
          Push-Location $root
          try {
            & $seven a "-t$env:PACKAGE_FORMAT" -y $target 'Monster/Monster.exe'
            if ($LASTEXITCODE -ne 0) { throw "Adding Monster.exe to the archive failed (exit $LASTEXITCODE)." }
          } finally { Pop-Location }
          $listing = (& $seven l $target | Out-String)
          if ($listing -notmatch 'Monster\\Monster\.exe' -or $listing -notmatch 'Monster\\Monster\.cmd') {
            throw 'The archive must contain both Monster.exe and Monster.cmd.'
          }
          Write-Host "Embedded Monster.exe next to Monster.cmd in $($archive[0].Name)."

      # Cheap post-mortem helper: shows which tags libgit2 kept in the bare
      # repository it cloned, useful when PyAppify rejects a setup version.
      - name: Diagnose packaged repository tags
        if: always()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $repo = Join-Path (Get-Location) 'pyappify_dist/Monster/data/apps/Monster/repo'
          if (Test-Path $repo) {
            try {
              $remoteUrl = (& git "--git-dir=$repo" remote get-url origin 2>$null | Out-String).Trim()
              Write-Host "Packaged repo origin: $remoteUrl"
              $all = (& git "--git-dir=$repo" tag -l 2>$null | Out-String).Trim()
              $list = @($all -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ })
              Write-Host "Packaged repo tag count: $($list.Count)"
              Write-Host "Contains build tag $env:TAG : $($list -contains $env:TAG)"
              Write-Host "First tags: $(($list | Select-Object -First 8) -join ', ')"
            } catch {
              Write-Host "Tag diagnosis unavailable: $($_.Exception.Message)"
            }
          } else {
            Write-Host 'Packaged repository not found (build step did not reach checkout).'
          }

      - name: Collect portable archives only
        id: collect
        env:
          PACKAGE_FORMAT: ${{ inputs.package_format }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          LAUNCHER_MODE: ${{ inputs.launcher }}
          APP_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CUSTOM_UPDATE_REPO: ${{ inputs.update_repo }}
        run: |
          New-Item -ItemType Directory -Path release_assets -Force | Out-Null
          $pattern = "Monster-win32-Portable-*.$env:PACKAGE_FORMAT"
          $files = @(Get-ChildItem -Path pyappify_dist -Filter $pattern -File)
          if ($files.Count -eq 0) {
            Write-Host 'pyappify_dist contents:'
            Get-ChildItem -Path pyappify_dist -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "No portable archive matching '$pattern' was produced."
          }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination release_assets -Force
          }

          # Enforce the "archive only" contract: no exe, no setup/installer.
          $unexpected = @(Get-ChildItem -Path release_assets -File | Where-Object {
            $_.Extension -notin @('.zip', '.7z') -or $_.Name -match '(?i)setup|installer'
          })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected non-portable artifacts: $($unexpected.Name -join ', ')"
          }

          $first = Join-Path release_assets $files[0].Name
          $hash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $sizeMB = [math]::Round($files[0].Length / 1MB, 1)
          $largest = ($files | Measure-Object -Property Length -Maximum).Maximum
          # A GitHub Release asset must be strictly smaller than 2 GiB
          # (2147483648 bytes). Uploading a larger file fails the whole job
          # even though the Actions artifact uploads fine, so skip the release
          # step instead of marking an otherwise successful build as failed.
          $releaseLimit = 2147483648
          $releaseReady = if ($largest -lt $releaseLimit) { 'true' } else { 'false' }
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "release_ready=$releaseReady" >> $env:GITHUB_OUTPUT
          "largest_bytes=$largest" >> $env:GITHUB_OUTPUT

          $repoUrl = $env:APP_REPO_URL
          if (-not [string]::IsNullOrWhiteSpace($env:CUSTOM_UPDATE_REPO)) {
            $repoUrl = "$env:CUSTOM_UPDATE_REPO".Trim()
          }

          # Keep this script pure ASCII: GitHub writes pwsh scripts as UTF-8
          # without a BOM, and Windows PowerShell 5.1 would otherwise decode
          # non-ASCII text as the local ANSI codepage. The Chinese release
          # notes live in YAML below, where GitHub handles the encoding.
          if ($env:LAUNCHER_MODE -eq 'updater') {
            $launcherSummary = @(
              ''
              'Launcher: PyAppify Tauri updater (Monster/Monster.exe).'
              "Update source (pyappify.yml git_url): $repoUrl"
              'Updates fetch only the new tag''s changed git objects into data/apps/Monster/working; the Python env, pip packages, templates and configs/ are not tracked there and survive intact.'
              'The first download is the full archive; later updates transfer only changed source files.'
              'Monster/Monster.cmd remains available for command-line or fully offline starts (it sets PYAPPIFY_UPGRADEABLE=0).'
            )
          } else {
            $launcherSummary = @(
              ''
              'Launcher: offline icon-only wrapper around Monster.cmd, no update or network logic.'
              'Re-run this workflow with launcher=updater to get incremental updates.'
            )
          }

          $summary = @(
            "## Monster portable package ($env:LAUNCHER_MODE)"
            ''
            "- Archive: $($files[0].Name) ($sizeMB MB)"
            "- SHA256: $hash"
            "- Version tag: $env:VERSION_TAG"
            "- Update source: $repoUrl"
            ''
            'Only the portable archive is published; PyAppify''s launcher-only zip, hash file and any installer are discarded.'
            'Extract (7z needs 7-Zip or Windows 11 23H2+) and double-click Monster/Monster.exe; Monster/Monster.cmd remains available for command-line arguments.'
            'Both entry points request administrator rights. The game runs elevated, so a non-elevated script gets Win32 error 5 (Access is denied) on every PostMessage and cannot click or press keys.'
            'The app ships ok_templates/ images with long file names; extract with 7-Zip / WinRAR into a short folder (e.g. C:\Monster) if Windows Explorer reports a long-path error.'
          ) + $launcherSummary
          if ($releaseReady -eq 'false') {
            $summary += @(
              ''
              "The archive is $([math]::Round($largest / 1GB, 2)) GiB, above GitHub's 2 GiB per-asset limit; the Release will use split 7z volumes instead."
              'The complete single-file archive is always downloadable from this run''s Actions artifact (Monster-portable-<version>).'
            )
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Monster-portable-${{ steps.version.outputs.number }}
          path: release_assets/*
          if-no-files-found: error
          retention-days: 30

      # GitHub caps a single Release asset at 2 GiB, but the portable 7z is
      # ~2.2 GiB. A 7z volume set is simply the archive split by bytes: 7-Zip
      # reads .001/.002/... as one continuous stream, so users still extract
      # the complete Monster folder in a single step. Verified locally with
      # 7z l / t / x against a multi-volume set with the original removed.
      - name: Split oversized 7z into release parts
        id: split
        if: ${{ steps.collect.outputs.release_ready != 'true' && inputs.package_format == '7z' }}
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          $partSize = [long]1900 * 1MB
          $limit = 2147483648
          $source = @(Get-ChildItem -Path release_assets -Filter '*.7z' -File)
          if ($source.Count -ne 1) { throw "Expected exactly one 7z archive in release_assets, found $($source.Count)." }
          New-Item -ItemType Directory -Path release_parts -Force | Out-Null
          $base = "Monster-win32-Portable-$env:VERSION_NUMBER.7z"
          $total = $source[0].Length
          $inStream = [System.IO.File]::OpenRead($source[0].FullName)
          $buffer = New-Object byte[] 4194304
          $index = 1
          $remaining = $total
          try {
            while ($remaining -gt 0) {
              $partPath = Join-Path (Get-Location) ("release_parts/{0}.{1:d3}" -f $base, $index)
              $outStream = [System.IO.File]::Create($partPath)
              # Do not use [math]::Min here: PowerShell binds it to
              # Min(int, int) and a >2 GiB Int64 length overflows Int32
              # ("value was either too large or too small for an Int32").
              $thisPart = if ($remaining -lt $partSize) { $remaining } else { $partSize }
              $written = 0
              try {
                while ($written -lt $thisPart) {
                  $space = $thisPart - $written
                  $toRead = if ($space -lt $buffer.Length) { [int]$space } else { $buffer.Length }
                  $read = $inStream.Read($buffer, 0, $toRead)
                  if ($read -le 0) { break }
                  $outStream.Write($buffer, 0, $read)
                  $written += $read
                }
              } finally { $outStream.Dispose() }
              $remaining -= $written
              $index++
            }
          } finally { $inStream.Dispose() }
          $parts = @(Get-ChildItem -Path release_parts -File | Sort-Object Name)
          if ($parts.Count -lt 2) { throw 'Splitting did not produce multiple parts.' }
          $sum = ($parts | Measure-Object -Property Length -Sum).Sum
          if ($sum -ne $total) { throw "Split size mismatch: $sum vs $total bytes." }
          $oversized = @($parts | Where-Object { $_.Length -ge $limit })
          if ($oversized.Count -gt 0) { throw "A part is still above 2 GiB: $($oversized.Name -join ', ')" }
          foreach ($p in $parts) { Write-Host ("  {0} ({1} MB)" -f $p.Name, [math]::Round($p.Length / 1MB, 1)) }
          Write-Host "Split $total bytes into $($parts.Count) Release-safe parts."
          $notes = @(
            ''
            '## GitHub Release split volumes'
            ''
            "The archive is $([math]::Round($total / 1GB, 2)) GiB, above GitHub's 2 GiB per-asset limit, so the Release uses $($parts.Count) split parts."
            'Download every .7z.001 / .7z.002 / ... part into one folder and open the .001 part with 7-Zip; it extracts the full Monster folder in one step.'
            'The complete single-file archive is also available as this run''s Actions artifact.'
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $notes
          "has_parts=true" >> $env:GITHUB_OUTPUT

      - name: Resolve release files
        id: release
        env:
          RELEASE_READY: ${{ steps.collect.outputs.release_ready }}
          HAS_PARTS: ${{ steps.split.outputs.has_parts }}
        run: |
          if ($env:RELEASE_READY -eq 'true') {
            $pattern = 'release_assets/*'
            $publish = 'true'
            Write-Host 'The portable archive fits a single GitHub Release asset.'
          } elseif ($env:HAS_PARTS -eq 'true') {
            $pattern = 'release_parts/*'
            $publish = 'true'
            Write-Host 'Publishing the split 7z volume parts to the GitHub Release.'
          } else {
            $pattern = ''
            $publish = 'false'
            Write-Host 'No Release-safe asset; the Actions artifact is the delivery channel.'
          }
          "pattern=$pattern" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Explain skipped GitHub release
        if: ${{ inputs.publish_release && steps.release.outputs.publish != 'true' }}
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          Write-Host "::warning::No Release-safe asset was produced; only the Actions artifact was published."
          Write-Host "Download the full archive from this run's artifact: Monster-portable-$env:VERSION_NUMBER (retention: 30 days)."
          Write-Host 'Use the default 7z format so an oversized archive can be split into sub-2-GiB Release parts.'

      - name: Publish GitHub release
        if: ${{ inputs.publish_release && steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Monster ${{ steps.version.outputs.number }} (portable)
          draft: false
          prerelease: false
          # Chinese text stays in YAML (GitHub handles UTF-8 here); the two
          # expressions keep the notes in sync with the selected mode / source.
          body: |
            ### Monster 便携版

            解压后双击 `Monster/Monster.exe` 启动；需要命令行参数或完全离线启动时可运行 `Monster/Monster.cmd`。

            - **必须以管理员权限运行**：`Monster.exe` 已内置 `requireAdministrator` 清单，双击会弹出一次 UAC 提权；`Monster.cmd` 通过 `fltmc` 自提权。鸣潮客户端本身是管理员权限，脚本若以普通权限启动，`PostMessage` 会被 UIPI 拦截并报 `(5, 'PostMessage', '拒绝访问。')`，表现为点击、按键完全无反应
            - 本次启动器模式：`${{ inputs.launcher }}`
            - 更新源（`pyappify.yml` 的 `git_url`）：`${{ inputs.update_repo || format('{0}/{1}.git', github.server_url, github.repository) }}`
            - `updater` 模式：`Monster.exe` 是 PyAppify 官方启动器，也就是原项目那个「启动 + 更新」程序。它只从上面的更新源 fetch 新版本 tag 的差异对象，再 checkout 到 `data/apps/Monster/working`；Python 环境、pip 依赖、模板资源和 `configs/` 都不在这个仓库里，因此不会被重新下载或覆盖。首次仍需完整包，之后每次更新只传变化的源码文件，用户配置与队伍配置全部保留
            - `cmd-only` 模式：`Monster.exe` 只是带图标和管理员权限清单的轻量包装器，不含更新或联网逻辑
            - `Monster.cmd` 设置了 `PYAPPIFY_UPGRADEABLE=0`，适合命令行参数或完全离线启动
            - 仅提供便携压缩包，不含安装程序，也不含在线安装包
            - 默认 7z 格式，请用 7-Zip 或 Windows 11 23H2+ 解压
            - 若资产为 `.7z.001`、`.7z.002` 等分卷：把全部分卷下载到同一目录，用 7-Zip 打开第一个（`.001`）解压即可，无需手动合并
            - Python 环境与依赖已随包提供，首次运行无需联网下载
            - 包内 `ok_templates/` 含长文件名，建议用 7-Zip / WinRAR 解压到较短目录（如 `C:\Monster`）
            - 由手动触发的 `Monster Portable Release` 工作流构建
          files: ${{ steps.release.outputs.pattern }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
